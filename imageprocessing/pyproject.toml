[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-human-behavior-analytics"
version = "0.1.0"
description = "Real-time human detection, tracking, pose estimation, and behavior classification."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Bayram Senbay"}]

dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
cv-human-behavior-analytics = "src.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
dashboard = ["streamlit>=1.28.0", "pandas>=2.0.0", "plotly>=5.18.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
